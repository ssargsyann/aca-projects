name: CV Zoo checks
on:
  push:
    paths: ["projects/cv-zoo-yolo-pytorch/**", ".github/workflows/cv-zoo-checks.yml"]
  pull_request:
    paths: ["projects/cv-zoo-yolo-pytorch/**", ".github/workflows/cv-zoo-checks.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/cv-zoo-yolo-pytorch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[models,plots]"
      - run: python -m unittest discover -s tests -v
      - run: cv-zoo demo --output artifacts/ci-demo
