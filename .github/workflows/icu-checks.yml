name: ICU project checks
on:
  push:
    paths: ["projects/icu-mortality-prediction/**", ".github/workflows/icu-checks.yml"]
  pull_request:
    paths: ["projects/icu-mortality-prediction/**", ".github/workflows/icu-checks.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/icu-mortality-prediction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: icu-mortality --help
