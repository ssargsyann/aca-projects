name: Customer segmentation checks
on:
  push:
    paths: ["projects/customer-segmentation-marketing/**", ".github/workflows/customer-segmentation-checks.yml"]
  pull_request:
    paths: ["projects/customer-segmentation-marketing/**", ".github/workflows/customer-segmentation-checks.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/customer-segmentation-marketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[reports]"
      - run: python -m unittest discover -s tests -v
      - run: customer-segments demo --output artifacts/ci-demo
      - run: customer-segments report --run artifacts/ci-demo/run --output artifacts/ci-report
