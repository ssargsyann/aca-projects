name: U-Net and YOLO workflow checks
on:
  push:
    paths: ["projects/unet-yolov8-cv/**", ".github/workflows/unet-yolo-checks.yml"]
  pull_request:
    paths: ["projects/unet-yolov8-cv/**", ".github/workflows/unet-yolo-checks.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/unet-yolov8-cv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
