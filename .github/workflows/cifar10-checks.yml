name: CIFAR-10 checks
on:
  push:
    paths: ["projects/cifar10-cnn-pytorch/**", ".github/workflows/cifar10-checks.yml"]
  pull_request:
    paths: ["projects/cifar10-cnn-pytorch/**", ".github/workflows/cifar10-checks.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/cifar10-cnn-pytorch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[reports]"
      - run: python -m unittest discover -s tests -v
      - run: cifar10-cnn demo --output artifacts/ci-demo
      - run: cifar10-cnn report --run artifacts/ci-demo/run --output artifacts/ci-report
