[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "aca-date-transformer"
version = "0.1.0"
description = "Educational encoder-decoder Transformer with disjoint synthetic date evaluation"
requires-python = ">=3.10"
dependencies = ["torch>=2.6,<3", "numpy>=1.26,<3", "matplotlib>=3.7,<4"]
[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5"]
[project.scripts]
date-transformer = "date_transformer.cli:main"
[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["date_transformer"]
