[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aca-cifar10-cnn"
version = "0.1.0"
description = "A custom CIFAR-10 CNN with separate validation and test workflows"
requires-python = ">=3.10"
dependencies = ["torch>=2.6,<3", "torchvision>=0.21,<1", "numpy>=1.26,<3", "pillow>=10,<14"]

[project.optional-dependencies]
reports = ["matplotlib>=3.7,<4"]
notebook = ["jupyterlab>=4,<5", "matplotlib>=3.7,<4"]

[project.scripts]
cifar10-cnn = "cifar10_cnn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
