[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aca-customer-segmentation"
version = "0.1.0"
description = "Reproducible descriptive segmentation with PCA, K-Means, and GMM"
requires-python = ">=3.10"
dependencies = ["pandas>=2,<3", "numpy>=1.26,<3", "scikit-learn>=1.5,<2", "joblib>=1.3,<2", "threadpoolctl>=3,<4"]

[project.optional-dependencies]
reports = ["matplotlib>=3.7,<4"]
notebook = ["jupyterlab>=4,<5", "matplotlib>=3.7,<4"]
download = ["kagglehub>=0.3,<1"]
legacy = ["kagglehub>=0.3,<1", "seaborn>=0.13,<1", "umap-learn>=0.5,<1"]

[project.scripts]
customer-segments = "customer_segments.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
