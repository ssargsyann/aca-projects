[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aca-cv-zoo"
version = "0.1.0"
description = "Four pretrained vision tasks and validated educational grid/anchor geometry"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pillow>=10,<14"]

[project.optional-dependencies]
models = ["torch>=2.6,<3", "torchvision>=0.21,<1"]
plots = ["matplotlib>=3.7,<4"]
notebook = ["jupyterlab>=4,<5", "matplotlib>=3.7,<4", "torch>=2.6,<3", "torchvision>=0.21,<1"]

[project.scripts]
cv-zoo = "cv_zoo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
