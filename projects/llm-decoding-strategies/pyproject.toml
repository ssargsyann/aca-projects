[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "aca-llm-decoding"
version = "0.1.0"
description = "Auditable raw-logit decoding with explicit offline GPT-2 experiments"
requires-python = ">=3.10"
dependencies = ["torch>=2.6,<3", "matplotlib>=3.7,<4"]
[project.optional-dependencies]
gpt2 = ["transformers>=4.56,<5", "safetensors>=0.4,<1", "huggingface-hub>=0.34,<1"]
notebook = ["jupyterlab>=4,<5"]
[project.scripts]
llm-decoding = "llm_decoding.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.ruff.lint.isort]
known-first-party = ["llm_decoding"]
